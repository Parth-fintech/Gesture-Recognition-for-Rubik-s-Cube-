name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # headless opencv avoids pulling in GUI/Qt libs the runner doesn't have;
          # mediapipe is only touched inside the __main__ guard, so it's not needed here.
          pip install numpy opencv-python-headless pytest

      - name: Run tests
        run: pytest test_gesture_cube.py -v
